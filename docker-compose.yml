version: '3.8'

services:
  # Konfigurasi Apache + PHP (Web Server)
  web:
    image: php:8.2-apache
    container_name: apache_server
    ports:
      - "80:80"
    volumes:
      - ./htdocs:/var/www/html
    depends_on:
      - db

  # Konfigurasi MySQL (Database)
  db:
    image: mysql:8.0
    container_name: mysql_server
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql

  # Konfigurasi phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_server
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db

volumes:
  db_data: