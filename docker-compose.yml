services:
  # Konfigurasi Apache + PHP (Web Server & REST API)
  web:
    image: php-apache-mysqli:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: necro_web
    ports:
      - "80:80"
    volumes:
      - ./htdocs:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=db_code_necromancer
    depends_on:
      - db

  # Konfigurasi MySQL Database
  db:
    image: mysql:8.0
    container_name: necro_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_code_necromancer
      MYSQL_USER: necro_user
      MYSQL_PASSWORD: necro_password
    volumes:
      - necro_db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Konfigurasi phpMyAdmin Web GUI
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: necro_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db

volumes:
  necro_db_data:
